  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #000000;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Lora', 'Georgia', serif;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.17, 0.55, 0.55, 1), transform 0.8s cubic-bezier(0.17, 0.55, 0.55, 1);
      transition-delay: var(--delay, 0s);
    }

    [data-visible="true"] .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-link-underline {
      position: relative;
    }

    .nav-link-underline::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #B9975B;
      /* Main gold color */
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.3s ease-in-out;
    }

    .nav-link-underline:hover::after,
    .nav-link-underline.active::after {
      transform: scaleX(1);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .pop-in {
      opacity: 0;
    }

    [data-visible="true"] .pop-in {
      animation: popIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes gentle-bounce {
      0%,
      100% {
        transform: translateY(0);
        animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
      }

      50% {
        transform: translateY(-15%);
        animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
      }
    }

    .animate-gentle-bounce {
      animation: gentle-bounce 2s infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out forwards;
      animation-delay: 1.5s;
    }

    .filter-to-white {
      filter: brightness(0) invert(1);
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    :root {
      --color-bg-subtle: #121212;
      --color-border: #374151;
      --color-bg-input: #262626;
      --color-text-primary: #E5E7EB;

      --color-text-cta: #000000;
      --color-accent-hover: rgba(185, 151, 91, 0.8);
      --swiper-theme-color: var(--corporate-gold);
    }
